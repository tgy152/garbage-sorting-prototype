# 非知识型意图拦截：这些问法虽然可能含领域词，但知识库不承载这类信息，
# 直接拒答比让模型自由发挥更可靠。由场景作者维护。
out_of_scope_patterns:
  - 哪家
  - 哪一家
  - 哪一年
  - 什么时候开始
  - 好喝吗
  - 好吃吗
  - 好不好吃
  - 多少钱
  - 靠谱吗
  - 值得买

sample_questions:
  - 一杯没喝完的奶茶应该怎么扔？
  - 外卖餐盒需要洗干净再扔吗？
  - 用过的纸巾属于可回收物吗？
  - 快递纸箱要撕掉胶带吗？
  - 泡面桶算可回收纸类吗？
  - 宿舍楼下没有厨余桶，果皮该扔哪？
  - 今天下午有没有篮球赛？

refusal_hint: 该问题超出垃圾分类投放引导范围，建议咨询当地环卫部门或查看所在城市的分类目录。
