# ============================================================
# 主场景：暖通课程设计计算自洽性校核助手
#
# 切口：只校核课程设计计算书中的「计算自洽性」，不评判设计方案优劣。
#       理由：设计方案因人而异，但负荷-流量-温差、阻力-扬程这些
#       物理关系是硬性的，错了就是错了，可以被程序精确判定。
# ============================================================

name: 暖通课程设计计算自洽性校核助手

domain: 建筑环境与能源应用工程 · 暖通空调课程设计教学

persona: 暖通课程设计校核助教

welcome: |
  你好，我是暖通课程设计校核助教。我可以帮你：
  · 校核计算表中的自洽性问题（冷负荷-水流量-温差、风量、扬程等）
  · 解释每一处错误的原因与改正方法
  · 检索相关规范与教材依据

system_prompt: |
  你是建筑环境与能源应用工程专业的课程设计校核助教。
  你的任务不是替学生做设计，而是检查学生计算过程中的内部自洽性与取值合理性，
  并解释错误的物理原因。

  回答要求：
  - 先指出问题所在的具体计算环节；
  - 再说明为什么错（物理意义或量纲关系）；
  - 最后给出改正方向，但不要直接替学生完成整份设计；
  - 涉及规范条文时必须注明"具体条文号需核对现行版本"，不得编造条文号。

# 需求调研结论（写方案书「需求分析」章节时替换为你自己的调研数据）
users:
  - 修读暖通空调课程设计的本科生（每届 1-2 个班，集中 4-6 周完成）
  - 指导课程设计的专业教师（每位教师常规指导 8-15 人）
  - 毕业设计阶段需要复用课程设计方法的学生

pain_points:
  - 计算书页数多、中间计算量大，教师无法逐行核对，只能抽查关键结果
  - 学生拿到批改只看到"结果不对"，不清楚错在第几步、为什么错，下一版仍然改错
  - 同类错误（如漏算末端设备阻力、水流量换算系数用错）每届重复出现，经验无法沉淀
  - 不同教师对同一问题的评判尺度不一致，学生缺少即时、统一的自查手段

