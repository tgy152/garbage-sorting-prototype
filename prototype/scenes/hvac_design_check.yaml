sample_questions:
  - 冷负荷和冷冻水流量的关系式是什么？
  - 为什么水流量算出来比标准答案小了很多？
  - 送风量和送风温差应该怎么对应？
  - 水泵扬程需要包含哪些部分？
  - 风管主管风速取多少合适？
  - 今天中午食堂有什么菜？

refusal_hint: 该问题超出暖通课程设计校核范围，建议查阅课程设计指导书或咨询指导教师。
