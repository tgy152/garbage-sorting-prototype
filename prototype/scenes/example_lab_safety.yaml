# ============================================================
# 示例场景配置，请整体替换为你自己的真实场景
# 注意：knowledge/example_lab_safety/ 里的文档是虚构演示数据，
#      正式参赛材料必须换成真实调研 + 真实数据。
# ============================================================

name: 实验室安全巡检助手

domain: 高校实验室安全管理

persona: 实验室安全巡检助手

welcome: |
  你好，我是实验室安全巡检助手。你可以问我：
  · 危化品应该怎么分类存放？
  · 发现试剂泄漏第一步做什么？
  · 废液可以倒进下水道吗？

system_prompt: |
  你是高校实验室安全管理领域的专业助手，服务于实验室安全巡检员和新进实验人员。
  你的知识来源仅限于给定的安全规范、设备手册与应急预案。

# 需求调研结论（写方案书"需求分析"章节时直接引用）
users:
  - 实验室安全巡检员（每周巡检 3 次，需现场判断合规性）
  - 新进研究生与本科生（入组前须通过安全考核）
  - 实验室安全责任人（需汇总隐患并跟踪整改）

pain_points:
  - 规范文件分散在多个 PDF 与纸质手册中，现场无法快速检索
  - 新人员工培训依赖口口相传，同一问题反复问，经验难以沉淀
  - 隐患描述不规范，整改跟踪缺少结构化记录

# 领域词表：用于「相关度门控」，检索分数不够高时
# 只有问题里出现这些词才放行，否则直接拒答，避免被无关问题带偏。
domain_keywords:
  - 实验室
  - 实验
  - 试剂
  - 危化品
  - 化学品
  - 有机溶剂
  - 溶剂
  - 泄漏
  - 洒了
  - 安全检查
  - 巡检
  - 隐患
  - 整改
  - 气瓶
  - 废液
  - 废弃物
  - 灭火器
  - 火灾
  - 洗眼器
  - 急救
  - 通风橱
  - 用电
  - 高温设备
  - 大风
  - 暴雨
  - 雷电
  - 预警
  - 安全

sample_questions:
  - 危化品应该如何分类存放？
  - 发现有机溶剂泄漏，第一步该做什么？
  - 实验废液可以直接倒进下水道吗？
  - 今天北京有 8 级大风，实验室要注意什么？
  - 请帮我推荐一家附近的火锅店。

refusal_hint: 该问题超出实验室安全知识库范围，建议咨询实验室安全责任人。
