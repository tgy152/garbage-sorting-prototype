# Render 部署配置（Blueprint）
#
# 用法：把仓库推到 GitHub 后，在 Render 里选 New → Blueprint，选中该仓库，
#       Render 会读取本文件自动建好服务。
#
# 说明：
#   · 免费实例闲置 15 分钟会休眠，下次访问约一分钟唤醒（页面上会显示加载提示）；
#   · 密钥不写进本文件（仓库是公开的），带 sync: false 的两项在 Render 后台填写；
#   · 想退回离线演示：把 APP_MODE 改成 mock，并把 VISION_BACKEND 改成 mock。
#   · 端口必须用平台分配的 $PORT 并绑定 0.0.0.0，否则 Render 探测不到。

services:
  - type: web
    name: garbage-sorting-prototype
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r prototype/requirements.txt
    startCommand: cd prototype && GRADIO_SERVER_PORT=$PORT GRADIO_SERVER_NAME=0.0.0.0 GRADIO_INBROWSER=false python app.py
    healthCheckPath: /
    envVars:
      - key: APP_MODE
        value: direct
      - key: PYTHON_VERSION
        value: "3.12.6"
      # 多模态问答（OpenAI 兼容接口，这里用通义千问）
      - key: LLM_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: LLM_MODEL
        value: qwen-plus
      - key: LLM_API_KEY
        sync: false
      # 拍照识别（多模态视觉模型）
      - key: VISION_BACKEND
        value: multimodal
      - key: VISION_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: VISION_MODEL
        value: qwen3.5-omni-plus-2026-03-15
      - key: VISION_API_KEY
        sync: false
